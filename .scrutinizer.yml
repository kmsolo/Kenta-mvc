build:
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run

    tests-and-coverage:
      environment:
        docker:
          remote_engine: true
      dependencies:
        before:
          - docker pull php:8.4-cli
      tests:
        override:
          - command: >
              docker run --rm -v $(pwd):/app -w /app php:8.4-cli sh -c "
              apt-get update -qq &&
              apt-get install -y -qq libzip-dev unzip git libssl-dev >/dev/null &&
              docker-php-ext-install zip >/dev/null &&
              pecl install xdebug >/dev/null 2>&1 &&
              docker-php-ext-enable xdebug &&
              echo 'xdebug.mode=coverage' >> /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini &&
              curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
              composer install --no-interaction --prefer-dist &&
              vendor/bin/phpunit --coverage-clover=coverage.xml
              "
            coverage:
              file: coverage.xml
              format: clover

filter:
  paths:
    - "src/*"
  excluded_paths:
    - "vendor/*"
    - "var/*"
    - "tests/*"

checks:
  php: true
